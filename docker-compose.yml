# Entorno de staging simulado: la aplicación empaquetada + PostgreSQL, igual que en producción.
# Uso:  docker compose up --build        (aplicación en http://localhost:8000)
# Es solo para pruebas de humo en http (cookies seguras y redirección a https desactivadas).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sigr
      POSTGRES_USER: sigr_app
      POSTGRES_PASSWORD: sigr_staging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigr_app -d sigr"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_NAME: sigr
      DB_USER: sigr_app
      DB_PASSWORD: sigr_staging
      DB_HOST: db
      DB_PORT: "5432"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-clave-de-staging-local-no-usar-en-produccion}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_SSL_REDIRECT: "0"
      DJANGO_HSTS_SECONDS: "0"
      SIGR_CARGAR_DEMO: "1"
    ports:
      - "8000:8000"
