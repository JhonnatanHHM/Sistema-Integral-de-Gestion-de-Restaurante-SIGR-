{% extends "base.html" %}
{% block titulo %}{{ titulo }} · SIGR{% endblock %}
{% block contenido %}
<section class="auth">
  <form class="auth__tarjeta" method="post" enctype="multipart/form-data" novalidate>
    {% csrf_token %}
    <h1>{{ titulo }}</h1>
    {% include "includes/formulario.html" %}
    <button class="boton boton--bloque" type="submit">Guardar</button>
    <p class="auth__pie"><a href="{{ volver }}">Cancelar</a></p>
  </form>
</section>
{% endblock %}
