{% extends "base.html" %}
{% block titulo %}Eliminar · SIGR{% endblock %}
{% block contenido %}
<section class="auth">
  <form class="auth__tarjeta" method="post">
    {% csrf_token %}
    <h1>Eliminar</h1>
    <p>¿Seguro que quieres eliminar <strong>{{ object }}</strong>? Esta acción no se puede deshacer.</p>
    <button class="boton boton--bloque boton--peligro" type="submit">Sí, eliminar</button>
    <p class="auth__pie"><a href="{{ volver }}">Cancelar</a></p>
  </form>
</section>
{% endblock %}
