{% extends "base.html" %}
{% block titulo %}Ingresar · SIGR{% endblock %}
{% block contenido %}
<section class="auth">
  <form class="auth__tarjeta" method="post" novalidate>
    {% csrf_token %}
    <h1>Ingresar</h1>
    {% include "includes/formulario.html" %}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="boton boton--bloque" type="submit">Ingresar</button>
    <p class="auth__pie">¿No tienes cuenta? <a href="{% url 'usuarios:registro' %}">Regístrate</a></p>
  </form>
</section>
{% endblock %}
