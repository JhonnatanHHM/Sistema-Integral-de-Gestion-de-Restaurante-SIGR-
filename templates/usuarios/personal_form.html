{% extends "base.html" %}
{% block titulo %}Nuevo personal · SIGR{% endblock %}
{% block contenido %}
<section class="auth">
  <form class="auth__tarjeta" method="post" novalidate>
    {% csrf_token %}
    <h1>Nuevo personal</h1>
    {% include "includes/formulario.html" %}
    <button class="boton boton--bloque" type="submit">Crear usuario</button>
    <p class="auth__pie"><a href="{% url 'usuarios:lista' %}">Volver al listado</a></p>
  </form>
</section>
{% endblock %}
