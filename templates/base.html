{% load static %}<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}SIGR · Sistema Integral de Gestión de Restaurante{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/sigr.css' %}">
</head>
<body>
  {% include "includes/encabezado.html" %}
  <main>
    {% if messages %}
    <div class="mensajes">
      {% for mensaje in messages %}<p class="mensaje mensaje--{{ mensaje.tags }}">{{ mensaje }}</p>{% endfor %}
    </div>
    {% endif %}
    {% block contenido %}{% endblock %}
  </main>
  {% include "includes/pie.html" %}
  <script src="{% static 'js/tiempo-real.js' %}" defer></script>
</body>
</html>
